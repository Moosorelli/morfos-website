<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lär känna Morfos — Morfos Edtech Akademi</title>
<meta name="description" content="Lär känna Morfos Edtech Akademi – en kort interaktiv kurs om hur vi bygger utbildningar.">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link href="fonts/fonts.css" rel="stylesheet">
<style id="morfos-style">
  :root{
    --bg:#F6F4EF; --bg-2:#EDE8DC; --card:#FFFFFF;
    --ink:#14231F; --ink-soft:#3E5148; --heading:#0E332C;
    --line:rgba(14,51,44,0.14); --accent:#7C8C6E; --accent-soft:#A9B49A;
    --panel:#0E332C; --panel-ink:#F6F4EF; --btn:#0E332C; --btn-ink:#F6F4EF; --btn-hover:#1B453B;
    --sand:#DCD2BB; --logo-bg:transparent; --good:#4C7A5E; --bad:#9C5A45;
    --edit:#FBF3DC; --edit-line:#D8C48A; --edit-ink:#6B5416;
    --radius:6px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1916; --bg-2:#172520; --card:#15211D;
      --ink:#E8E6DF; --ink-soft:#B4BFB7; --heading:#E9EEE6;
      --line:rgba(233,238,230,0.14); --accent:#A9B49A; --accent-soft:#7C8C6E;
      --panel:#1D3A32; --panel-ink:#F1EFE8; --btn:#A9B49A; --btn-ink:#0E332C; --btn-hover:#BCC6AE;
      --sand:#2A3A33; --logo-bg:#F6F4EF;
      --edit:#2B271A; --edit-line:#6E5F2E; --edit-ink:#E6D59E;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1916; --bg-2:#172520; --card:#15211D;
    --ink:#E8E6DF; --ink-soft:#B4BFB7; --heading:#E9EEE6;
    --line:rgba(233,238,230,0.14); --accent:#A9B49A; --accent-soft:#7C8C6E;
    --panel:#1D3A32; --panel-ink:#F1EFE8; --btn:#A9B49A; --btn-ink:#0E332C; --btn-hover:#BCC6AE;
    --sand:#2A3A33; --logo-bg:#F6F4EF;
    --edit:#2B271A; --edit-line:#6E5F2E; --edit-ink:#E6D59E;
  }
  html{ scroll-padding-top:env(safe-area-inset-top, 0px); }
  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{ background:var(--bg); color:var(--ink); font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; }
  h1,h2,h3{ font-family:'Space Grotesk','Inter',system-ui,sans-serif; font-weight:600; letter-spacing:-0.01em; color:var(--heading); margin:0; }
  p{ line-height:1.68; color:var(--ink-soft); margin:0 0 16px 0; font-size:16.5px; }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }
  img{ max-width:100%; }
  .kicker{ font-family:'Space Grotesk','Inter',sans-serif; font-size:13px; letter-spacing:0.04em; color:var(--accent); font-weight:600; }

  /* Topbar */
  .topbar{ position:sticky; top:env(safe-area-inset-top, 0px); z-index:40; background:color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); }
  .topbar-inner{ max-width:900px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:12px; }
  .brandmark{ height:32px; width:32px; flex:none; background:var(--logo-bg); border-radius:6px; padding:2px; object-fit:contain; }
  .brandtext{ display:flex; flex-direction:column; line-height:1.1; }
  .brandtext .b1{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; letter-spacing:0.08em; color:var(--heading); }
  .brandtext .b2{ font-size:10.5px; letter-spacing:0.1em; color:var(--accent); }
  .top-actions{ margin-left:auto; display:flex; gap:8px; }
  .pill-btn{ background:transparent; border:1px solid var(--line); border-radius:20px; padding:7px 13px; font-size:12.5px; font-family:'Space Grotesk',sans-serif; font-weight:600; color:var(--heading); white-space:nowrap; }
  .pill-btn:hover{ background:var(--bg-2); }
  .pill-btn.active{ background:var(--edit-line); color:#2E2408; border-color:var(--edit-line); }
  .stepper{ max-width:900px; margin:0 auto; padding:0 20px 11px 20px; display:flex; gap:6px; }
  .step-dot{ flex:1; height:4px; border-radius:2px; background:var(--line); }
  .step-dot.done{ background:var(--accent-soft); }
  .step-dot.current{ background:var(--heading); }

  /* Layout */
  #app{ max-width:720px; margin:0 auto; padding:44px 22px 130px 22px; }
  .screen{ animation:fadeUp .45s ease; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  /* Start */
  .hero{ text-align:center; padding:12px 0 6px 0; }
  .hero-mark{ width:84px; height:84px; margin:0 auto 22px auto; display:block; background:var(--logo-bg); border-radius:14px; padding:4px; }
  .hero h1{ font-size:36px; line-height:1.12; margin:12px auto 16px auto; max-width:600px; }
  .hero .lead{ font-size:18px; max-width:540px; margin:0 auto 26px auto; }
  .meta-row{ display:flex; justify-content:center; gap:30px; margin:0 auto 30px auto; flex-wrap:wrap; }
  .meta-item{ text-align:center; }
  .meta-item .m-num{ font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:600; color:var(--heading); }
  .meta-item .m-lab{ font-size:12.5px; color:var(--accent); margin-top:2px; }
  .note-card{ background:var(--bg-2); border-radius:var(--radius); padding:18px 20px; margin:0 0 26px 0; }
  .note-card p{ margin:0; font-size:15px; }
  .agenda{ margin:0 0 30px 0; }
  .agenda-item{ display:flex; gap:16px; padding:14px 0; border-top:1px solid var(--line); }
  .agenda-item:last-child{ border-bottom:1px solid var(--line); }
  .agenda-num{ font-family:'Space Grotesk',sans-serif; font-size:13px; color:var(--accent); font-weight:600; width:22px; flex:none; padding-top:2px; }
  .agenda-title{ font-weight:600; color:var(--heading); font-size:15.5px; }
  .agenda-desc{ font-size:14px; color:var(--ink-soft); margin-top:2px; }

  /* Buttons */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:14px 24px; border-radius:var(--radius); border:none; font-size:15px; font-weight:600; font-family:'Space Grotesk',sans-serif; text-decoration:none; }
  .btn:active{ transform:scale(0.98); }
  .btn-primary{ background:var(--btn); color:var(--btn-ink); }
  .btn-primary:hover{ background:var(--btn-hover); }
  .btn-primary:disabled{ background:var(--line); color:var(--ink-soft); cursor:not-allowed; }
  .btn-secondary{ background:transparent; color:var(--heading); border:1px solid var(--heading); }
  .btn-secondary:hover{ background:var(--bg-2); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); padding:14px 8px; border:none; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px; }
  .btn-ghost:hover{ color:var(--heading); }
  .btn-block{ width:100%; }

  /* Module */
  .mod-header{ margin-bottom:24px; }
  .mod-header .kicker{ display:block; margin-bottom:10px; }
  .mod-header h2{ font-size:28px; line-height:1.2; }
  .mod-time{ font-size:13px; color:var(--ink-soft); margin-top:8px; }
  .illu{ background:var(--bg-2); border-radius:16px; padding:18px; margin-bottom:24px; display:flex; justify-content:center; }
  .illu svg{ width:100%; max-width:230px; height:auto; display:block; }
  .callout{ background:var(--bg-2); border-left:3px solid var(--accent); padding:16px 20px; border-radius:0 var(--radius) var(--radius) 0; margin:24px 0; }
  .callout p{ margin:0; color:var(--heading); font-weight:500; font-size:15.5px; }
  .divider{ height:1px; background:var(--line); margin:32px 0; }

  /* Activity panel */
  .activity{ background:var(--panel); color:var(--panel-ink); border-radius:10px; padding:26px 22px; }
  .activity .a-kicker{ font-family:'Space Grotesk',sans-serif; font-size:12.5px; letter-spacing:0.04em; color:#B9C6A9; font-weight:600; margin-bottom:8px; display:block; }
  .activity h3{ color:var(--panel-ink); font-size:20px; margin-bottom:8px; }
  .activity .a-instr{ color:rgba(246,244,239,0.78); font-size:14.5px; margin-bottom:14px; line-height:1.6; }
  .activity-progress{ font-size:12.5px; color:#B9C6A9; margin-top:16px; font-family:'Space Grotesk',sans-serif; }
  .p-label{ font-size:12px; color:rgba(246,244,239,0.6); font-family:'Space Grotesk',sans-serif; margin:4px 0 8px 0; }
  .p-label.light{ color:var(--accent); }

  .card-d{ background:rgba(246,244,239,0.07); border:1px solid rgba(246,244,239,0.17); border-radius:8px; padding:17px; margin-bottom:12px; }
  .stmt{ font-size:15.5px; margin-bottom:13px; color:var(--panel-ink); font-weight:500; line-height:1.5; }
  .two-btn{ display:flex; gap:10px; }
  .opt-btn{ flex:1; padding:10px 12px; border-radius:6px; border:1px solid rgba(246,244,239,0.3); background:transparent; color:var(--panel-ink); font-size:14px; font-weight:600; font-family:'Space Grotesk',sans-serif; }
  .opt-btn:hover{ background:rgba(246,244,239,0.1); }
  .answered .opt-btn{ opacity:0.4; pointer-events:none; }
  .answered .opt-btn.chosen{ opacity:1; background:rgba(246,244,239,0.15); }
  .fb{ display:none; margin-top:12px; padding-top:12px; border-top:1px solid rgba(246,244,239,0.17); font-size:14px; line-height:1.58; color:rgba(246,244,239,0.88); }
  .fb.show{ display:block; }
  .fb .tag{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; margin-bottom:5px; display:block; }
  .fb.ok .tag{ color:#B9CFA6; } .fb.no .tag{ color:#E0AC98; }

  .duel-round{ font-family:'Space Grotesk',sans-serif; font-size:12.5px; color:#B9C6A9; margin-bottom:8px; }
  .duel-task{ font-size:14.5px; color:rgba(246,244,239,0.82); margin-bottom:14px; line-height:1.55; }
  .duel-pair{ display:flex; flex-direction:column; gap:10px; }
  .duel-opt{ text-align:left; background:rgba(246,244,239,0.06); border:1px solid rgba(246,244,239,0.18); border-radius:8px; padding:15px; color:var(--panel-ink); font-size:14.5px; line-height:1.55; }
  .duel-opt:hover{ border-color:#B9C6A9; }
  .duel-opt .lbl{ font-family:'Space Grotesk',sans-serif; font-size:12px; color:#B9C6A9; margin-bottom:6px; display:block; }
  .duel-opt.right{ border-color:#B9CFA6; background:rgba(185,207,166,0.14); }
  .duel-opt.wrong{ border-color:#E0AC98; background:rgba(217,162,142,0.1); opacity:0.75; }
  .duel-done .duel-opt{ pointer-events:none; }

  .step-row{ display:flex; flex-direction:column; gap:10px; margin-bottom:20px; }
  .step-btn{ width:100%; text-align:left; background:rgba(246,244,239,0.06); border:1px solid rgba(246,244,239,0.17); border-radius:8px; padding:15px 17px; color:var(--panel-ink); }
  .sb-top{ display:flex; align-items:center; gap:12px; }
  .sb-num{ width:27px; height:27px; border-radius:50%; border:1px solid #B9C6A9; flex:none; display:flex; align-items:center; justify-content:center; font-size:12.5px; font-family:'Space Grotesk',sans-serif; font-weight:600; color:#B9C6A9; }
  .step-btn.open .sb-num{ background:#B9C6A9; color:#0E332C; }
  .sb-title{ font-weight:600; font-size:15px; font-family:'Space Grotesk',sans-serif; }
  .sb-body{ display:none; margin-top:10px; padding-left:39px; font-size:14px; color:rgba(246,244,239,0.82); line-height:1.6; }
  .step-btn.open .sb-body{ display:block; }
  .choice{ display:block; width:100%; text-align:left; padding:12px 14px; margin-bottom:8px; border-radius:8px; border:1px solid rgba(246,244,239,0.28); background:transparent; color:var(--panel-ink); font-size:14.5px; }
  .choice:hover{ background:rgba(246,244,239,0.08); }
  .choice.right{ background:#B9CFA6; color:#0E332C; border-color:#B9CFA6; }
  .choice.wrong{ background:#E0AC98; color:#0E332C; border-color:#E0AC98; }
  .choices-done .choice{ pointer-events:none; }

  /* Principle chips */
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin:0 0 6px 0; }
  .chip{ font-family:'Space Grotesk',sans-serif; font-size:12.5px; font-weight:600; padding:6px 12px; border-radius:20px; border:1px solid; display:inline-flex; gap:6px; align-items:center; }
  .chip.dark{ border-color:rgba(246,244,239,0.35); color:var(--panel-ink); background:rgba(246,244,239,0.06); }
  .chip.dark:hover{ background:rgba(246,244,239,0.14); }
  .chip.dark.on{ background:#B9C6A9; color:#0E332C; border-color:#B9C6A9; }
  .chip.light{ border-color:var(--line); color:var(--heading); background:var(--bg-2); }
  .chip.light:hover{ background:var(--sand); }
  .chip.light.on{ background:var(--btn); color:var(--btn-ink); border-color:var(--btn); }
  .chip-detail{ display:none; font-size:13.5px; line-height:1.6; padding:13px 15px; border-radius:6px; margin:8px 0 14px 0; }
  .chip-detail.show{ display:block; }
  .chip-detail.dark{ background:rgba(246,244,239,0.08); color:rgba(246,244,239,0.9); }
  .chip-detail.light{ background:var(--bg-2); color:var(--heading); }
  .chip-detail b{ display:block; margin-bottom:3px; }

  /* Team */
  .team-grid{ display:grid; grid-template-columns:1fr; gap:18px; margin-top:26px; }
  @media(min-width:640px){ .team-grid{ grid-template-columns:1fr 1fr; } }
  .person{ background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; display:flex; flex-direction:column; }
  .person-photo{ aspect-ratio:4/3; background:var(--bg-2); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .person-photo img{ width:100%; height:100%; object-fit:cover; display:block; }
  .initials{ width:92px; height:92px; border-radius:50%; background:var(--panel); color:var(--panel-ink); display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:32px; }
  .person-body{ padding:20px; }
  .person-body h3{ font-size:19px; }
  .person-role{ font-size:13.5px; color:var(--accent); margin:4px 0 12px 0; font-weight:600; }
  .person-body p{ font-size:15px; white-space:pre-line; }
  .person-link{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; color:var(--heading); }

  /* Courses + gallery */
  .course-list{ margin-top:22px; }
  .course{ display:flex; gap:16px; padding:18px 0; border-top:1px solid var(--line); }
  .course:last-child{ border-bottom:1px solid var(--line); }
  .course-icon{ width:46px; height:46px; flex:none; border-radius:10px; background:var(--bg-2); display:flex; align-items:center; justify-content:center; font-size:22px; }
  .course h3{ font-size:16.5px; }
  .course-aud{ font-size:13px; color:var(--accent); font-weight:600; margin:3px 0 6px 0; }
  .course p{ font-size:14.5px; margin:0; }
  .feature-row{ display:flex; flex-wrap:wrap; gap:8px; margin:22px 0 0 0; }
  .feature{ font-size:13px; font-family:'Space Grotesk',sans-serif; font-weight:600; padding:6px 12px; border-radius:20px; background:var(--bg-2); color:var(--ink-soft); }
  .gallery{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px; }
  @media(min-width:640px){ .gallery{ grid-template-columns:1fr 1fr 1fr; } }
  .g-item{ background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .g-item img{ width:100%; aspect-ratio:1/1; object-fit:cover; display:block; }
  .g-cap{ font-size:13px; color:var(--ink-soft); padding:8px 10px; line-height:1.45; }

  /* Quiz */
  .q-card{ background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:14px; }
  .q-text{ font-size:16.5px; font-weight:600; color:var(--heading); margin-bottom:16px; line-height:1.45; }
  .q-opt{ display:block; width:100%; text-align:left; padding:12px 15px; margin-bottom:8px; border-radius:var(--radius); border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:15px; }
  .q-opt:hover{ border-color:var(--accent); }
  .q-opt.sel{ border-color:var(--heading); background:var(--bg-2); font-weight:600; }
  .q-opt.right{ border-color:var(--good); background:color-mix(in srgb, var(--good) 16%, transparent); }
  .q-opt.wrong{ border-color:var(--bad); background:color-mix(in srgb, var(--bad) 14%, transparent); }
  .q-done .q-opt{ pointer-events:none; }
  .q-fb{ font-size:14px; color:var(--ink-soft); margin-top:6px; line-height:1.55; }

  /* End */
  .aha{ background:var(--panel); color:var(--panel-ink); border-radius:12px; padding:26px 22px; margin:26px 0; }
  .aha h3{ color:var(--panel-ink); font-size:19px; margin-bottom:10px; }
  .aha p{ color:rgba(246,244,239,0.88); font-size:15.5px; }
  .contact{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:26px 22px; text-align:center; }
  .contact h2{ font-size:24px; margin-bottom:10px; }
  .contact .email{ font-family:'Space Grotesk',sans-serif; font-weight:600; color:var(--heading); font-size:16px; margin:6px 0 18px 0; word-break:break-all; }
  .contact-actions{ display:flex; flex-direction:column; gap:10px; align-items:stretch; max-width:360px; margin:0 auto; }

  /* Edit mode */
  .edit-bar{ background:var(--edit); border:1px solid var(--edit-line); border-radius:8px; padding:14px 16px; margin-bottom:22px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .edit-bar .eb-text{ flex:1 1 220px; font-size:13.5px; color:var(--edit-ink); line-height:1.5; }
  .edit-bar .btn{ padding:10px 16px; font-size:13.5px; }
  .edit-status{ width:100%; font-size:13px; color:var(--edit-ink); font-weight:600; }
  .edit-fields{ background:var(--edit); border-top:1px solid var(--edit-line); padding:16px 20px 20px 20px; }
  .edit-fields label{ display:block; font-size:12px; font-weight:700; color:var(--edit-ink); margin:12px 0 5px 0; }
  .edit-fields input[type=text], .edit-fields textarea{ width:100%; padding:9px 11px; border:1px solid var(--edit-line); border-radius:5px; background:var(--card); color:var(--ink); font-family:'Inter',sans-serif; font-size:14px; }
  .edit-fields textarea{ min-height:110px; resize:vertical; }
  .file-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .file-btn{ position:relative; overflow:hidden; display:inline-flex; align-items:center; padding:9px 14px; border-radius:5px; border:1px solid var(--edit-line); background:var(--card); color:var(--edit-ink); font-size:13px; font-weight:600; font-family:'Space Grotesk',sans-serif; cursor:pointer; }
  .file-btn input{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .small-btn{ padding:9px 14px; border-radius:5px; border:1px solid var(--edit-line); background:transparent; color:var(--edit-ink); font-size:13px; font-weight:600; font-family:'Space Grotesk',sans-serif; }
  .g-edit{ padding:8px; background:var(--edit); border-top:1px solid var(--edit-line); display:flex; flex-direction:column; gap:6px; }
  .g-edit input{ width:100%; padding:7px 9px; border:1px solid var(--edit-line); border-radius:5px; background:var(--card); color:var(--ink); font-size:13px; }
  .add-tile{ border:2px dashed var(--edit-line); border-radius:8px; background:var(--edit); display:flex; align-items:center; justify-content:center; aspect-ratio:1/1; color:var(--edit-ink); font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; text-align:center; padding:10px; position:relative; }
  .add-tile input{ position:absolute; inset:0; opacity:0; cursor:pointer; }

  /* Bottom nav */
  .navbar{ position:fixed; left:0; right:0; bottom:0; z-index:30; background:color-mix(in srgb, var(--bg) 95%, transparent); backdrop-filter:blur(6px); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom, 0px); }
  .navbar-inner{ max-width:720px; margin:0 auto; padding:12px 22px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .nav-note{ font-size:12.5px; color:var(--ink-soft); text-align:center; flex:1; }

  @media(max-width:480px){
    .hero h1{ font-size:28px; }
    #app{ padding:34px 17px 130px 17px; }
    .mod-header h2{ font-size:23px; }
  }
</style>
</head>

let artifactNs = null;

(async function initCapabilities(){
  if(!window.claude || typeof window.claude.use !== "function") return;
  try{
    const results = await Promise.all([ window.claude.use("artifact"), window.claude.use("user") ]);
    artifactNs = results[0];
    const user = results[1];
    let allowed = false;
    if(user){
      try{ allowed = (await user.isOwner()) === true; }catch(e){ allowed = false; }
    }
    canEdit = !!(artifactNs && allowed);
    renderTopbar();
  }catch(e){}
})();

function buildDocument(data){
  const style = document.getElementById('morfos-style').textContent;
  const app = document.getElementById('morfos-app').textContent;
  const json = JSON.stringify(data).replace(/</g, '\\u003c');
  const close = '</' + 'script>';
  return '<!DOCTYPE html>\n<html lang="sv">\n<head>\n' + HEAD_HTML + '\n<style id="morfos-style">' + style + '</style>\n</head>\n<body>\n<div id="root"></div>\n<script type="application/json" id="morfos-data">' + json + close + '\n<script id="morfos-app">' + app + close + '\n</body>\n</html>\n';
}

async function publishChanges(){
  if(!artifactNs){ editStatus = "Sparande är inte tillgängligt i den här vyn."; render(); return; }
  const html = buildDocument(DATA);
  if(html.length > 15 * 1024 * 1024){ editStatus = "Sidan blir för stor. Ta bort någon bild och försök igen."; render(); return; }
  editStatus = "Sparar…"; render();
  try{ sessionStorage.setItem("morfos-return-screen", state.screen); }catch(e){}
  try{
    await artifactNs.publish(html);
    editStatus = "Sparat — sidan laddas om med de nya ändringarna.";
    dirty = false;
    render();
  }catch(err){
    const code = err && err.code;
    if(code === "conflict"){ editStatus = "Någon annan sparade samtidigt. Sidan laddas om med den senaste versionen."; }
    else if(code === "not_writer" || code === "not_granted" || code === "not_declared" || code === "capability_disabled" || code === "consent_required" || code === "capability_removed"){
      editStatus = ""; canEdit = false; editMode = false; renderTopbar();
    }
    else if(code === "too_large"){ editStatus = "Sidan blev för stor. Ta bort någon bild och försök igen."; }
    else if(code === "rate_limited"){ editStatus = "Du har sparat många gånger i rad. Vänta en stund och försök igen."; }
    else { editStatus = "Det gick inte att spara just nu. Försök igen om en liten stund."; }
    render();
  }
}

function cancelEdits(){

}

function readImage(file, maxDim){
  return new Promise((resolve, reject)=>{
    const fr = new FileReader();
    fr.onerror = ()=> reject(new Error("read"));
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error("decode"));
      img.onload = ()=>{
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * scale));
        c.height = Math.max(1, Math.round(img.height * scale));
        const ctx = c.getContext('2d');
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function renderNavbar(){
  const nav = document.getElementById('navbar');
  const prev = document.getElementById('btnPrev');
  const next = document.getElementById('btnNext');
  const note = document.getElementById('navNote');
  if(state.screen === "start"){ nav.style.display = "none"; return; }
  nav.style.display = "block";
  prev.style.visibility = "visible";

  next.disabled = false;
  note.textContent = SCREEN_LABEL[state.screen] || "";

  else next.textContent = "Nästa →";
}

function render(){

  else if(s === "team") el = renderTeam();

  else el = renderModule(MODULES.find(m => m.key === s));
  el.classList.add('screen');
  app.appendChild(el);

}

function esc(str){ const d = document.createElement('div'); d.textContent = str == null ? "" : String(str); return d.innerHTML; }
function escAttr(str){ return String(str == null ? "" : str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function safeUrl(u){ const s = String(u || "").trim(); return /^(https?:|mailto:)/i.test(s) ? s : (s ? "https://" + s.replace(/^\/+/, "") : ""); }

function chips(container, ids, variant){
  const row = document.createElement('div');
  row.className = "chip-row";
  const detail = document.createElement('div');
  detail.className = "chip-detail " + variant;
  ids.forEach(id=>{
    const p = PRINCIPLES[id]; if(!p) return;
    const c = document.createElement('button');
    c.type = "button";
    c.className = "chip " + variant;
    c.innerHTML = "<span>" + p.icon + "</span><span>" + esc(p.name) + "</span>";
    c.addEventListener('click', ()=>{
      const was = c.classList.contains('on');
      row.querySelectorAll('.chip').forEach(x => x.classList.remove('on'));
      if(was){ detail.classList.remove('show'); }
      else { c.classList.add('on'); detail.innerHTML = "<b>" + p.icon + " " + esc(p.name) + "</b>" + esc(p.text); detail.classList.add('show'); }
    });
    row.appendChild(c);
  });
  container.appendChild(row);
  container.appendChild(detail);
}

      <div class="agenda-item"><div class="agenda-num">1</div><div><div class="agenda-title">Pedagoger först — tekniken sen</div><div class="agenda-desc">Vilka vi är och vad vi gör</div></div></div>
      <div class="agenda-item"><div class="agenda-num">2</div><div><div class="agenda-title">Så lär sig hjärnan</div><div class="agenda-desc">Kunskapsgrunden bakom varje kurs</div></div></div>
      <div class="agenda-item"><div class="agenda-num">3</div><div><div class="agenda-title">Från er kurs till interaktivt lärande</div><div class="agenda-desc">Våra fyra steg, i ett verkligt exempel</div></div></div>
      <div class="agenda-item"><div class="agenda-num">4</div><div><div class="agenda-title">Människorna bakom</div><div class="agenda-desc">Vi som bygger era utbildningar</div></div></div>
      <div class="agenda-item"><div class="agenda-num">5</div><div><div class="agenda-title">Utbildningar vi har byggt</div><div class="agenda-desc">Exempel från vår verksamhet</div></div></div>
    </div>
    <button class="btn btn-primary btn-block" id="startBtn">Starta</button>`;
  w.querySelector('#startBtn').addEventListener('click', ()=> goTo("m1"));
  return w;
}

/* ================= MODULER ================= */
function renderModule(m){
  const w = document.createElement('div');
  w.innerHTML = `<div class="mod-header"><span class="kicker">${esc(m.kicker)}</span><h2>${esc(m.title)}</h2><div class="mod-time">Cirka ${m.time} ${m.time === 1 ? "minut" : "minuter"}</div></div>`;
  const il = document.createElement('div'); il.className = "illu"; il.innerHTML = m.illustration; w.appendChild(il);
  m.body.forEach(t => { const p = document.createElement('p'); p.textContent = t; w.appendChild(p); });
  const co = document.createElement('div'); co.className = "callout"; co.innerHTML = "<p>" + esc(m.keyPoint) + "</p>"; w.appendChild(co);
  const lab = document.createElement('div'); lab.className = "p-label light"; lab.textContent = "Sammanfattningen ovan bygger på:"; w.appendChild(lab);
  chips(w, ["elaboration"], "light");
  const dv = document.createElement('div'); dv.className = "divider"; w.appendChild(dv);

  const a = m.activity;
  const act = document.createElement('div'); act.className = "activity";
  act.innerHTML = `<span class="a-kicker">Din tur</span><h3>${esc(a.title)}</h3><p class="a-instr">${esc(a.instr)}</p><div class="p-label">Övningen bygger på:</div>`;
  chips(act, a.principles, "dark");
  const body = document.createElement('div'); body.style.marginTop = "14px"; act.appendChild(body);
  const prog = document.createElement('div'); prog.className = "activity-progress";
  let total = 0;
  const update = (n)=>{ markDone(m.key, n); prog.textContent = n >= total ? "✓ Klart" : n + " av " + total + " genomförda"; };
  if(a.type === "myth"){ total = a.items.length; buildMyth(body, a, update); }
  else if(a.type === "duel"){ total = a.rounds.length; buildDuel(body, a, update); }
  else if(a.type === "steps"){ total = a.steps.length + 1; buildSteps(body, a, update); }
  prog.textContent = "0 av " + total + " genomförda";
  act.appendChild(prog);
  w.appendChild(act);
  return w;
}

function buildMyth(c, a, update){
  let n = 0;
  a.items.forEach(item=>{
    const card = document.createElement('div'); card.className = "card-d";
    card.innerHTML = `<div class="stmt">${esc(item.text)}</div><div class="two-btn"><button class="opt-btn" data-v="myt">Myt</button><button class="opt-btn" data-v="sanning">Sanning</button></div><div class="fb"><span class="tag"></span><span class="txt"></span></div>`;
    card.querySelectorAll('.opt-btn').forEach(b=>{
      b.addEventListener('click', ()=>{
        if(card.classList.contains('answered')) return;
        card.classList.add('answered'); b.classList.add('chosen');
        const ok = b.dataset.v === item.answer;
        const fb = card.querySelector('.fb');
        fb.classList.add('show', ok ? 'ok' : 'no');
        fb.querySelector('.tag').textContent = ok ? "Rätt tänkt" : (item.answer === "myt" ? "Faktiskt en myt" : "Faktiskt sant");
        fb.querySelector('.txt').textContent = item.explain;
        update(++n);
      });
    });
    c.appendChild(card);
  });
}

function buildDuel(c, a, update){
  let n = 0;
  a.rounds.forEach((r, i)=>{
    const box = document.createElement('div'); box.className = "card-d";
    box.innerHTML = `<div class="duel-round">Val ${i+1} av ${a.rounds.length}</div><div class="duel-task">${esc(r.task)}</div><div class="duel-pair"><button class="duel-opt" data-k="a"><span class="lbl">Upplägg A</span>${esc(r.a)}</button><button class="duel-opt" data-k="b"><span class="lbl">Upplägg B</span>${esc(r.b)}</button></div><div class="fb"><span class="tag"></span><span class="txt"></span></div>`;
    box.querySelectorAll('.duel-opt').forEach(o=>{
      o.addEventListener('click', ()=>{
        if(box.classList.contains('duel-done')) return;
        box.classList.add('duel-done');
        box.querySelectorAll('.duel-opt').forEach(x => x.classList.add(x.dataset.k === r.correct ? 'right' : 'wrong'));
        const ok = o.dataset.k === r.correct;
        const fb = box.querySelector('.fb');
        fb.classList.add('show', ok ? 'ok' : 'no');
        fb.querySelector('.tag').textContent = ok ? "Rätt" : "Inte riktigt";
        fb.querySelector('.txt').textContent = r.feedback;
        update(++n);
      });
    });
    c.appendChild(box);
  });
}

function buildSteps(c, a, update){
  let n = 0;
  const row = document.createElement('div'); row.className = "step-row";
  const opened = new Set();
  a.steps.forEach((s, i)=>{
    const b = document.createElement('button'); b.type = "button"; b.className = "step-btn";
    b.innerHTML = `<div class="sb-top"><div class="sb-num">${i+1}</div><div class="sb-title">${esc(s.title)}</div></div><div class="sb-body">${esc(s.body)}</div>`;
    b.addEventListener('click', ()=>{
      b.classList.toggle('open');
      if(!opened.has(i)){ opened.add(i); update(++n); }
    });
    row.appendChild(b);
  });
  c.appendChild(row);
  const sc = a.scenario;
  const box = document.createElement('div'); box.className = "card-d";
  box.innerHTML = `<div class="duel-round">Ett verkligt exempel</div><div class="duel-task">${esc(sc.text)}</div><div class="stmt">${esc(sc.question)}</div><div class="choices"></div><div class="fb"><span class="tag"></span><span class="txt"></span></div>`;
  const ch = box.querySelector('.choices');
  sc.options.forEach(opt=>{
    const b = document.createElement('button'); b.type = "button"; b.className = "choice"; b.textContent = opt.label;
    b.addEventListener('click', ()=>{
      if(box.classList.contains('choices-done')) return;
      box.classList.add('choices-done');
      b.classList.add(opt.correct ? 'right' : 'wrong');
      const fb = box.querySelector('.fb');
      fb.classList.add('show', opt.correct ? 'ok' : 'no');
      fb.querySelector('.tag').textContent = opt.correct ? "Precis" : "Så gör vi inte";
      fb.querySelector('.txt').textContent = sc.explain;
      update(++n);
    });
    ch.appendChild(b);
  });
  c.appendChild(box);
}

/* ================= TEAM ================= */
function initials(name){
  const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return "?";
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length-1][0] : "")).toUpperCase();
}

function editBar(){
  const bar = document.createElement('div'); bar.className = "edit-bar";
  bar.innerHTML = `<div class="eb-text">Du redigerar. När du sparar syns ändringarna för alla som öppnar länken.${dirty ? " <b>Du har osparade ändringar.</b>" : ""}</div>`;
  const sb = document.createElement('button'); sb.className = "btn btn-primary"; sb.textContent = "Spara och publicera";
  sb.disabled = !dirty;
  sb.addEventListener('click', publishChanges);
  const cb = document.createElement('button'); cb.className = "btn btn-secondary"; cb.textContent = "Avbryt";
  cb.addEventListener('click', ()=>{ if(!dirty || confirm("Vill du kasta dina osparade ändringar?")) cancelEdits(); });
  bar.appendChild(sb); bar.appendChild(cb);
  if(editStatus){ const st = document.createElement('div'); st.className = "edit-status"; st.textContent = editStatus; bar.appendChild(st); }
  return bar;
}

function markDirty(){
  if(!dirty){ dirty = true; editStatus = ""; const bar = document.querySelector('.edit-bar'); if(bar){ bar.replaceWith(editBar()); } }
}

function renderTeam(){
  const w = document.createElement('div');
  if(editMode) w.appendChild(editBar());
  const head = document.createElement('div');
  head.innerHTML = `<div class="mod-header"><span class="kicker">Del 4 · Människorna bakom</span><h2>Vi som bygger era utbildningar</h2></div>
    <p>Bakom varje kurs står pedagoger — inte ett produktteam som gissar vad som engagerar. Vi arbetar nära er, med ert innehåll och era deltagare i fokus.</p>`;
  w.appendChild(head);
  const grid = document.createElement('div'); grid.className = "team-grid";
  DATA.team.forEach((person, idx)=>{
    const card = document.createElement('div'); card.className = "person";
    const photo = document.createElement('div'); photo.className = "person-photo";
    if(person.photo){ photo.innerHTML = `<img src="${escAttr(person.photo)}" alt="${escAttr(person.name)}">`; }
    else { photo.innerHTML = `<div class="initials">${esc(initials(person.name))}</div>`; }
    card.appendChild(photo);
    const body = document.createElement('div'); body.className = "person-body";
    const link = safeUrl(person.link);
    body.innerHTML = `<h3>${esc(person.name)}</h3><div class="person-role">${esc(person.role)}</div><p>${esc(person.bio)}</p>${link ? `<a class="person-link" href="${escAttr(link)}" target="_blank" rel="noopener">${esc(person.linkText || link)} →</a>` : ""}`;
    card.appendChild(body);
    if(editMode) card.appendChild(personEditor(person, idx));
    grid.appendChild(card);
  });
  w.appendChild(grid);
  return w;
}

function personEditor(person, idx){
  const f = document.createElement('div'); f.className = "edit-fields";
  f.innerHTML = `
    <label>Namn</label><input type="text" data-f="name" value="${escAttr(person.name)}">
    <label>Roll</label><input type="text" data-f="role" value="${escAttr(person.role)}">
    <label>Presentation (tom rad ger nytt stycke)</label><textarea data-f="bio">${esc(person.bio)}</textarea>
    <label>Länk (valfri)</label><input type="text" data-f="link" value="${escAttr(person.link)}" placeholder="https://…">
    <label>Länktext</label><input type="text" data-f="linkText" value="${escAttr(person.linkText)}" placeholder="Läs mer">
    <label>Bild</label>
    <div class="file-row"><span class="file-btn">${person.photo ? "Byt bild" : "Ladda upp bild"}<input type="file" accept="image/jpeg,image/png,image/webp,image/gif"></span>${person.photo ? '<button type="button" class="small-btn" data-remove="1">Ta bort bild</button>' : ""}</div>`;
  f.querySelectorAll('[data-f]').forEach(inp=>{
    inp.addEventListener('input', ()=>{ DATA.team[idx][inp.dataset.f] = inp.value; markDirty(); });
    inp.addEventListener('change', ()=>{ render(); });
  });
  f.querySelector('input[type=file]').addEventListener('change', async (e)=>{
    const file = e.target.files && e.target.files[0]; if(!file) return;
    try{
      DATA.team[idx].photo = await readImage(file, 900);
      dirty = true; editStatus = ""; render();
    }catch(err){
      editStatus = "Bilden kunde inte läsas. Prova en JPG- eller PNG-bild."; render();
    }
  });
  const rm = f.querySelector('[data-remove]');
  if(rm) rm.addEventListener('click', ()=>{ DATA.team[idx].photo = ""; dirty = true; editStatus = ""; render(); });
  return f;
}

/* ================= KURSER + GALLERI ================= */
function renderCourses(){
  const w = document.createElement('div');
  if(editMode) w.appendChild(editBar());
  const head = document.createElement('div');
  head.innerHTML = `<div class="mod-header"><span class="kicker">Del 5 · Exempel</span><h2>Utbildningar vi har byggt</h2></div>
    <p>Varje kurs är skräddarsydd för sin målgrupp — men alla bygger på samma pedagogiska grund.</p>`;
  w.appendChild(head);
  const list = document.createElement('div'); list.className = "course-list";
  COURSES.forEach(c=>{
    const item = document.createElement('div'); item.className = "course";
    item.innerHTML = `<div class="course-icon">${c.icon}</div><div><h3>${esc(c.title)}</h3><div class="course-aud">${esc(c.aud)}</div><p>${esc(c.text)}</p></div>`;
    list.appendChild(item);
  });
  w.appendChild(list);
  const feat = document.createElement('div'); feat.className = "feature-row";
  ["Delas som en länk","Fungerar på mobil","Test och intyg","Er grafiska profil","Anpassad för målgruppen"].forEach(t=>{
    const s = document.createElement('span'); s.className = "feature"; s.textContent = t; feat.appendChild(s);
  });
  w.appendChild(feat);

  if(DATA.gallery.length || editMode){
    const gh = document.createElement('div');
    gh.innerHTML = `<div class="divider"></div><h3 style="font-size:20px;">Glimtar från vår verksamhet</h3>`;
    w.appendChild(gh);
    const g = document.createElement('div'); g.className = "gallery";
    DATA.gallery.forEach((im, idx)=>{
      const it = document.createElement('div'); it.className = "g-item";
      it.innerHTML = `<img src="${escAttr(im.src)}" alt="${escAttr(im.caption || "Bild från Morfos")}">${im.caption && !editMode ? `<div class="g-cap">${esc(im.caption)}</div>` : ""}`;
      if(editMode){
        const ed = document.createElement('div'); ed.className = "g-edit";
        ed.innerHTML = `<input type="text" placeholder="Bildtext (valfri)" value="${escAttr(im.caption || "")}"><button type="button" class="small-btn">Ta bort</button>`;
        ed.querySelector('input').addEventListener('input', (e)=>{ DATA.gallery[idx].caption = e.target.value; markDirty(); });
        ed.querySelector('button').addEventListener('click', ()=>{ DATA.gallery.splice(idx, 1); dirty = true; editStatus = ""; render(); });
        it.appendChild(ed);
      }
      g.appendChild(it);
    });
    if(editMode){
      const add = document.createElement('label'); add.className = "add-tile";
      add.innerHTML = `＋ Lägg till bilder<input type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple>`;
      add.querySelector('input').addEventListener('change', async (e)=>{
        const files = Array.from(e.target.files || []);
        let failed = 0;
        for(const file of files){
          try{ DATA.gallery.push({ src: await readImage(file, 1100), caption:"" }); }
          catch(err){ failed++; }
        }
        dirty = true;
        editStatus = failed ? (failed + " bild(er) kunde inte läsas. Prova JPG eller PNG.") : "";
        render();
      });
      g.appendChild(add);
    }
    w.appendChild(g);
  }
  return w;
}

/* ================= AVSTÄMNING ================= */
function renderQuiz(){
  const w = document.createElement('div');
  w.innerHTML = `<div class="mod-header"><span class="kicker">Avstämning</span><h2>Fyra snabba frågor</h2><div class="mod-time">Ett sista exempel på aktiv återkallning — du får svaret direkt.</div></div>`;
  chips(w, ["retrieval","desirable_difficulty"], "light");
  const sp = document.createElement('div'); sp.style.height = "14px"; w.appendChild(sp);
  QUIZ.forEach((q, qi)=>{
    const card = document.createElement('div'); card.className = "q-card";
    card.innerHTML = `<div class="q-text">${qi+1}. ${esc(q.q)}</div>`;
    const answered = state.quiz[qi] !== null;
    if(answered) card.classList.add('q-done');
    q.opts.forEach((o, oi)=>{
      const b = document.createElement('button'); b.type = "button"; b.className = "q-opt"; b.textContent = o;
      if(answered){
        if(oi === q.correct) b.classList.add('right');
        else if(oi === state.quiz[qi]) b.classList.add('wrong');
      }
      b.addEventListener('click', ()=>{
        if(state.quiz[qi] !== null) return;
        state.quiz[qi] = oi; save(); render();
      });
      card.appendChild(b);
    });
    if(answered){
      const fb = document.createElement('div'); fb.className = "q-fb";
      fb.textContent = (state.quiz[qi] === q.correct ? "Rätt. " : "Rätt svar: " + q.opts[q.correct] + ". ") + q.why;
      card.appendChild(fb);
    }
    w.appendChild(card);
  });
  return w;
}

/* ================= SLUT ================= */
function renderEnd(){
  const w = document.createElement('div');
  const score = state.quiz.filter((a,i)=> a === QUIZ[i].correct).length;
  MorfosSCORM.complete(score, QUIZ.length);
  const email = DATA.email || "info@morfos.se";
  const subject = encodeURIComponent("Digitala utbildningar — Morfos");
  const fredrik = DATA.team.find(p => p.id === "fredrik");
  const fLink = fredrik ? safeUrl(fredrik.link) : "";
  w.innerHTML = `
    <div class="mod-header" style="text-align:center;"><span class="kicker">Tack för att du tog dig tid</span><h2 style="font-size:30px; margin-top:10px;">Du har precis gått en Morfos-utbildning</h2>
    <div class="mod-time">${score} av ${QUIZ.length} rätt på avstämningen</div></div>
    <div class="aha">
      <h3>Det var hela poängen</h3>
      <p>Under de senaste minuterna har du tagit ställning innan du fick facit, jämfört två upplägg sida vid sida, fått återkoppling direkt och övat i ett verkligt exempel. Inget av det var slumpmässigt — varje moment var valt utifrån hur hjärnan lär sig.</p>
      <p style="margin-bottom:14px;">Precis så bygger vi era utbildningar. Med ert innehåll, för era deltagare.</p>
      <div class="p-label">Det här har du upplevt:</div>
      <div id="endChips"></div>
    </div>
    <div class="contact">
      <span class="kicker">Hur skulle er utbildning kunna se ut?</span>
      <h2 style="margin-top:10px;">Hör av er så berättar vi mer</h2>
      <p>Vi skräddarsyr pedagogiska digitala kurser — utifrån era önskemål eller kurser ni redan har — som leder till lärande och utveckling i ert fält.</p>
      <div class="email">${esc(email)}</div>
      <div class="contact-actions">
        <a class="btn btn-primary" href="mailto:${escAttr(email)}?subject=${subject}">Skicka ett mejl</a>
        ${fLink ? `<a class="btn btn-secondary" href="${escAttr(fLink)}" target="_blank" rel="noopener">Läs mer om Fredrik</a>` : ""}
        <a class="btn btn-secondary" href="/">Tillbaka till morfos.se</a>
      </div>
    </div>`;
  chips(w.querySelector('#endChips'), ["retrieval","feedback","contrast","cognitive_load","generation","situated"], "dark");
  return w;
}

/* ---------- Start ---------- */
render();
</script>
