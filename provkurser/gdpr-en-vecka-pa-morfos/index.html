<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GDPR: One week at Morfos · Morfos Edtech Akademi</title>
<meta name="description" content="A 15-minute scenario-based GDPR course for all employees, in English and Swedish.">
<link rel="icon" type="image/svg+xml" href="assets/morfos-mark.svg">
<link rel="preload" href="fonts/outfit-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="course.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <img src="assets/morfos-mark.svg" alt="">
      <div class="brand-text">
        <small id="brandName">Morfos Edtech Akademi</small>
        <strong id="courseTitle">GDPR: One week at Morfos</strong>
      </div>
    </div>
    <div class="lang" role="group" id="langGroup" aria-label="Language">
      <button type="button" data-lang="en" lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="sv" lang="sv" aria-pressed="false">SV</button>
    </div>
    <button type="button" class="btn btn-ghost btn-small" id="exitBtn">Exit</button>
  </div>
</header>
<nav class="week" id="week" aria-label="Your week" hidden></nav>
<main id="main" tabindex="-1"></main>

<dialog id="exitDialog" aria-labelledby="exitTitle">
  <h2 id="exitTitle"></h2>
  <p id="exitBody"></p>
  <div class="actions">
    <button type="button" class="btn btn-primary" id="exitConfirm"></button>
    <button type="button" class="btn btn-ghost" id="exitCancel"></button>
  </div>
</dialog>

<script src="content.js"></script>
<script src="scorm.js"></script>
<script src="app.js"></script>
</body>
</html>
