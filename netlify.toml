# Built with Eleventy: blog posts in blogg/inlagg/ become pages under /blogg/.
# The home page (index.html) and assets are copied as they are.
[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
